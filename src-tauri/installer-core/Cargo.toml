[package]
name = "installer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha1 = "0.10"
regex = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
