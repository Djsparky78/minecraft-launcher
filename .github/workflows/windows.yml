name: Windows build and installer tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup default stable-msvc
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Exercise native Windows version detection
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p installer-core platform::tests -- --nocapture
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --workspace --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri:build -- --no-bundle
